name: live-cli (temp, PR 71)
on:
  push:
    branches: [feat/cli]
    paths: ['.github/workflows/live-cli.yml']
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: pip install -r requirements.txt
      - name: approve path (write file + run bash)
        run: |
          mkdir -p /tmp/proj
          printf 'y\ny\ny\ny\ny\ny\ny\ny\n' | timeout 600 python cli.py -C /tmp/proj -m nvidia/nemotron-3.5-super-vl-120b-a12b -p "Create a file hello.py in the current folder that prints exactly: hi from cli. Then run it with bash (python hello.py) and tell me the output." 2>&1 | tee /tmp/approve.log
          echo "----- files"; ls -la /tmp/proj
          echo "----- hello.py"; cat /tmp/proj/hello.py
          python /tmp/proj/hello.py | tee /tmp/run.txt
          grep -q "hi from cli" /tmp/run.txt
          grep -q "approve?" /tmp/approve.log
      - name: deny path (bash denied)
        run: |
          mkdir -p /tmp/deny
          printf 'n\nn\nn\nn\nn\nn\n' | timeout 600 python cli.py -C /tmp/deny -m nvidia/nemotron-3.5-super-vl-120b-a12b -p "Use the bash tool to run exactly this command: touch flag.txt . Do not use any other tool." 2>&1 | tee /tmp/deny.log
          echo "----- files"; ls -la /tmp/deny
          grep -q "denied" /tmp/deny.log
          test ! -f /tmp/deny/flag.txt
      - name: interactive repl (pty)
        continue-on-error: true
        run: |
          (sleep 2; printf '/help\n'; sleep 1; printf '/cwd\n'; sleep 1; printf 'Reply with just the number: what is 2+2?\n'; sleep 90; printf '/exit\n') | timeout 150 script -qec "python cli.py -C /tmp/proj -m nvidia/nemotron-3.5-super-vl-120b-a12b" /dev/null | tee /tmp/repl.log
          grep -q "/exit" /tmp/repl.log
